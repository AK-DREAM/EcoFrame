[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoframe"
version = "0.1.0"
description = "Coarse-to-fine frame selection for long-video question answering"
requires-python = ">=3.10,<3.11"
dependencies = [
  "accelerate>=1.13,<1.14",
  "datasets>=2.16.1,<2.17",
  "decord==0.6.0",
  "einops>=0.6.1,<0.7",
  "numpy>=1.26.4,<2",
  "open-clip-torch>=3.3,<3.4",
  "opencv-python>=4.11,<4.12",
  "packaging>=26,<27",
  "pandas>=2.3.3,<2.4",
  "pillow>=12.2,<13",
  "pyyaml>=6.0.3,<7",
  "qwen-vl-utils>=0.0.14,<0.0.15",
  "requests>=2.34,<3",
  "sentencepiece==0.1.99",
  "timm>=1.0.27,<1.1",
  "torch>=2.1.2,<2.2",
  "torchvision>=0.16.2,<0.17",
  "tqdm>=4.67.3,<4.68",
  "transformers==4.49.0",
]

[tool.setuptools.packages.find]
include = ["core", "core.*", "llava", "llava.*"]
